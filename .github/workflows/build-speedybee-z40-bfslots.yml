name: Build SpeedyBee F405 V4 Z40 BF Slots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-speedybee-z40-bfslots.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact ArduPilot source
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: 240b5085037c129ebbf8bdc52425356a9bec0d12
          path: ardupilot
          submodules: recursive
          fetch-depth: 1

      - name: Verify source
        shell: bash
        run: |
          set -euxo pipefail
          cd ardupilot
          test "$(git rev-parse HEAD)" = "240b5085037c129ebbf8bdc52425356a9bec0d12"
          test -f libraries/AP_HAL_ChibiOS/hwdef/speedybeef4v4/hwdef.dat
          grep -n "void AP_OSD_MSP_DisplayPort::flush" libraries/AP_OSD/AP_OSD_MSP_DisplayPort.cpp
          grep -n "msp_process_out_osd_config" libraries/AP_MSP/AP_MSP_Telem_Backend.cpp

      - name: Patch Z40 Betaflight RC slots
        shell: bash
        run: |
          set -euxo pipefail
          cd ardupilot
          python3 - <<'PY'
          from pathlib import Path

          # Caddx/Ascent GT Pro Z40 uses Betaflight OSD RC slots, not ordinary MSP_RC.
          # Betaflight renders each slot as a 5-character value in -1000..+1000.
          # For this first compatibility test, copy physical CH9 into all four slots.
          # That removes any ambiguity between the manual's Slot0/Slot1 naming and
          # the Caddx PC Tool channel labels. Once confirmed, slots can be separated.

          backend = Path('libraries/AP_MSP/AP_MSP_Telem_Backend.cpp')
          s = backend.read_text()
          old = '''        osd_config.items_position[i] = pos;\n    }\n    // Post flight statistics\n'''
          new = '''        osd_config.items_position[i] = pos;\n    }\n\n#if AP_RC_CHANNEL_ENABLED\n    // Advertise OSD_RC_CHANNELS as a visible 4-row Betaflight-style element.\n    // Test position: x=25, y=15 on the 53x20 HD canvas.\n    osd_config.items_position[OSD_RC_CHANNELS] = MSP_OSD_START + 25 + 15 * MSP_OSD_STEP_Y;\n#endif\n\n    // Post flight statistics\n'''
          if old not in s:
              raise SystemExit('OSD config patch point not found')
          backend.write_text(s.replace(old, new, 1))

          dp = Path('libraries/AP_OSD/AP_OSD_MSP_DisplayPort.cpp')
          s = dp.read_text()

          old_inc = '#include <GCS_MAVLink/GCS.h>\n'
          new_inc = '#include <GCS_MAVLink/GCS.h>\n#include <RC_Channel/RC_Channel.h>\n#include <stdio.h>\n'
          if old_inc not in s:
              raise SystemExit('include patch point not found')
          s = s.replace(old_inc, new_inc, 1)

          old_flush = '''void AP_OSD_MSP_DisplayPort::flush(void)\n{\n    // grab the screen and force a redraw\n    _displayport->msp_displayport_grab();\n    _displayport->msp_displayport_draw_screen();\n\n    // ok done processing displayport data\n    // let's process incoming MSP frames (and reply if needed)\n    _displayport->process_incoming_data();\n}\n'''

          new_flush = '''void AP_OSD_MSP_DisplayPort::flush(void)\n{\n#if AP_RC_CHANNEL_ENABLED\n    // Betaflight-compatible OSD_RC_CHANNELS data for Z40.\n    // CH9 is copied into all four RC slots for the first test so either\n    // Slot0-based firmware or the PC Tool's CH9 selection sees the same knob.\n    RC_Channels *rc_channels = RC_Channels::get_singleton();\n    if (rc_channels != nullptr) {\n        uint16_t pwm[16] {};\n        const uint8_t count = rc_channels->get_radio_in(pwm, 16);\n        const uint8_t idx = 8; // zero-based physical CH9\n\n        int32_t value = 0;\n        if (count > idx) {\n            int32_t in = pwm[idx];\n            if (in < 1000) {\n                in = 1000;\n            } else if (in > 2000) {\n                in = 2000;\n            }\n            value = (in - 1500) * 2;\n        }\n\n        char text[6];\n        snprintf(text, sizeof(text), "%5ld", (long)value);\n        for (uint8_t slot = 0; slot < 4; slot++) {\n            _displayport->msp_displayport_write_string(25, 15 + slot, false, text);\n        }\n    }\n#endif\n\n    // grab the screen and force a redraw\n    _displayport->msp_displayport_grab();\n    _displayport->msp_displayport_draw_screen();\n\n    // ok done processing displayport data\n    // let's process incoming MSP frames (and reply if needed)\n    _displayport->process_incoming_data();\n}\n'''

          if old_flush not in s:
              raise SystemExit('DisplayPort flush patch point not found')
          dp.write_text(s.replace(old_flush, new_flush, 1))
          PY

          git diff --check
          git diff -- libraries/AP_MSP/AP_MSP_Telem_Backend.cpp libraries/AP_OSD/AP_OSD_MSP_DisplayPort.cpp

      - name: Install ArduPilot build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          cd ardupilot
          Tools/environment_install/install-prereqs-ubuntu.sh -y

      - name: Build ArduCopter for SpeedyBee F405 V4
        shell: bash
        run: |
          set -euxo pipefail
          source ~/.profile
          cd ardupilot
          ./waf configure --board speedybeef4v4
          ./waf copter

      - name: Collect firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          cp ardupilot/build/speedybeef4v4/bin/arducopter.apj out/ArduCopter_240b5085_speedybeef4v4_Z40_BFSLOTS_CH9TEST.apj
          if [ -f ardupilot/build/speedybeef4v4/bin/arducopter.bin ]; then
            cp ardupilot/build/speedybeef4v4/bin/arducopter.bin out/ArduCopter_240b5085_speedybeef4v4_Z40_BFSLOTS_CH9TEST.bin
          fi
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lah out

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: speedybeef4v4-z40-bfslots-ch9test
          path: out/
          if-no-files-found: error
